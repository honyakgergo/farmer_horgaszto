<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Farmer Horgásztó">
  <!-- FARMER HORGÁSZTÓ — böngészőikon.
       A fejléc/lábléc hal-logója (icons.svg#fish-logo).

       SZÍNVÁLASZTÁS: arany alap, mélyzöld hal — nem fordítva.
       Az arany középtónus, ezért világos ÉS sötét böngészőfülön is
       kiugrik; a mélyzöld alapú változat a sötét témás fülsávban
       gyakorlatilag eltűnt (üres sötét kockának látszott).

       A hal szándékosan majdnem teljesen kitölti a négyzetet, hogy
       16 képpontos fülön is felismerhető maradjon.

       EZ A MESTERFÁJL: ebből készül a favicon.ico (16/32/48) és a
       fish-icon-32/180.png. Az oldalak SZÁNDÉKOSAN nem erre
       hivatkoznak: a VS Code Live Server az SVG-be is beinjektálja a
       live-reload scriptjét, amitől a Chrome nem tudja kirajzolni az
       ikont. A raszter ikonokba nem tud injektálni. -->
  <rect width="64" height="64" rx="12" fill="#c2a44b"/>
  <g transform="translate(-4.07,15.3) scale(0.759)" fill="#1a2416">
    <path d="M8 22C17 9 40 5 57 13c3 1.6 6 3.4 9 6-3 2.6-6 4.4-9 6-17 8-40 4-49-9z"/>
    <path d="M66 19c5-5 11-9 21-13-3 8-3 22 0 30-10-4-16-8-21-13z"/>
    <path d="M31 8.4c5-5.4 14-5 19-1.2-6-.6-13-.2-19 1.2z"/>
    <path d="M31 35.6c5 5.4 14 5 19 1.2-6 .6-13 .2-19-1.2z"/>
    <circle cx="19" cy="19" r="2.4" fill="#c2a44b"/>
  </g>
</svg>
